<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="卡匣：一个本地优先的 Nintendo Switch 卡带收藏管家，记录购买价格、游玩时长与出借信息。">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="卡匣">
  <title>卡匣 · Switch 卡带管家</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/home" aria-label="卡匣首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <rect x="7" y="4.5" width="26" height="31" rx="6" fill="currentColor"/>
            <path d="M14 4.5v7a2.5 2.5 0 0 0 2.5 2.5h7A2.5 2.5 0 0 0 26 11.5v-7" fill="#f5f1e8"/>
            <rect x="12.5" y="21" width="15" height="2.6" rx="1.3" fill="#f5f1e8" opacity=".9"/>
            <rect x="12.5" y="26" width="9" height="2.6" rx="1.3" fill="#f5f1e8" opacity=".55"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>卡匣</strong>
          <small>SWITCH 卡带管家</small>
        </span>
      </a>

      <button class="btn btn-primary sidebar-add" data-action="add-game" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>
        <span>添加卡带</span>
      </button>

      <nav class="nav" aria-label="页面">
        <a class="nav-item" href="#/home" data-nav="home">
          <svg class="icon" aria-hidden="true"><use href="#i-home"></use></svg>
          <span>总览</span>
        </a>
        <a class="nav-item" href="#/library" data-nav="library">
          <svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg>
          <span>卡带库</span>
          <span class="nav-badge" id="navCountLibrary" hidden>0</span>
        </a>
        <a class="nav-item" href="#/loans" data-nav="loans">
          <svg class="icon" aria-hidden="true"><use href="#i-handoff"></use></svg>
          <span>出借</span>
          <span class="nav-badge nav-badge-red" id="navCountLoans" hidden>0</span>
        </a>
        <a class="nav-item" href="#/stats" data-nav="stats">
          <svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg>
          <span>统计</span>
        </a>
      </nav>

      <div class="sidebar-spacer"></div>

      <button class="storage-card" data-action="open-settings" type="button">
        <span class="storage-icon" aria-hidden="true">
          <svg class="icon"><use href="#i-database"></use></svg>
        </span>
        <span class="storage-copy">
          <strong>本地收藏</strong>
          <small id="sidebarStorage">正在读取…</small>
        </span>
        <svg class="icon storage-chevron" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
      </button>

      <p class="sidebar-tip">数据只保存在你的设备上<br>记得偶尔导出一次备份</p>
      <p class="sidebar-version">KAXIA <span>v1.3.11</span></p>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar-left">
          <a class="mobile-brand" href="#/home" aria-label="卡匣首页">
            <span class="mobile-brand-mark" aria-hidden="true">
              <svg viewBox="0 0 40 40" fill="none">
                <rect x="7" y="4.5" width="26" height="31" rx="6" fill="currentColor"/>
                <path d="M14 4.5v7a2.5 2.5 0 0 0 2.5 2.5h7A2.5 2.5 0 0 0 26 11.5v-7" fill="#f5f1e8"/>
                <rect x="12.5" y="21" width="15" height="2.6" rx="1.3" fill="#f5f1e8"/>
              </svg>
            </span>
            <strong>卡匣</strong>
          </a>
          <div class="crumb" aria-label="当前位置">
            <span>卡匣</span>
            <span class="crumb-sep">/</span>
            <strong id="topbarTitle">总览</strong>
          </div>
        </div>
        <div class="topbar-right">
          <div class="save-pill" id="savePill" role="status" aria-live="polite">
            <span class="save-dot"></span>
            <span id="saveText">正在读取…</span>
          </div>
          <button class="icon-btn" data-action="open-settings" aria-label="设置" title="设置" type="button">
            <svg class="icon"><use href="#i-settings"></use></svg>
          </button>
          <button class="btn btn-primary topbar-add" data-action="add-game" type="button">
            <svg class="icon"><use href="#i-plus"></use></svg>
            <span>添加卡带</span>
          </button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1">
        <div class="loading-state">
          <span class="loading-mark"></span>
          <p>正在打开你的卡带柜…</p>
        </div>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="手机导航">
    <a href="#/home" data-nav="home">
      <svg class="icon"><use href="#i-home"></use></svg><span>总览</span>
    </a>
    <a href="#/library" data-nav="library">
      <svg class="icon"><use href="#i-grid"></use></svg><span>卡带库</span>
    </a>
    <a href="#/loans" data-nav="loans">
      <svg class="icon"><use href="#i-handoff"></use></svg><span>出借</span>
      <i class="mobile-dot" id="mobileLoanDot" hidden></i>
    </a>
    <a href="#/stats" data-nav="stats">
      <svg class="icon"><use href="#i-chart"></use></svg><span>统计</span>
    </a>
  </nav>
  <button class="mobile-fab" data-action="add-game" aria-label="添加卡带" type="button">
    <svg class="icon"><use href="#i-plus"></use></svg>
  </button>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <noscript>
    <div class="noscript">卡匣需要启用 JavaScript 才能使用。</div>
  </noscript>

  <script src="./assets/app.js"></script>
</body>
</html>
